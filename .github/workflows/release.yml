name: Package skill release

# Builds the upload-ready skill package and attaches it to the GitHub Release,
# so `releases/latest/download/ai-film-production.skill` always resolves to the
# newest version. The package uses a `.skill` extension (zip bytes with a custom
# suffix): Claude accepts `.skill` on upload, and macOS/Safari won't auto-extract
# it on download the way it does a `.zip`. Triggered by pushing a version tag
# (e.g. `git tag v2.0 && git push origin v2.0`), or manually against an existing tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ai-film-production.skill
        run: |
          set -euo pipefail
          name=ai-film-production
          stage="$(mktemp -d)"
          mkdir -p "$stage/$name"
          # Everything the skill ships with, wrapped in a top-level
          # `ai-film-production/` folder (the layout Claude's upload expects).
          # Repo-only machinery (git, CI, build artefacts) is excluded.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.zip' \
            --exclude='*.skill' \
            ./ "$stage/$name/"
          # `.skill` = zip bytes, custom extension: Claude accepts it on upload,
          # and macOS/Safari won't auto-extract it on download.
          ( cd "$stage" && zip -r -X "$GITHUB_WORKSPACE/$name.skill" "$name" )
          echo "--- package contents ---"
          unzip -l "$name.skill"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ai-film-production.skill --clobber
          else
            gh release create "$tag" ai-film-production.skill \
              --title "$tag" \
              --notes "Upload-ready skill package \`ai-film-production.skill\` attached below (a zip Claude accepts directly; macOS won't auto-extract it). See the README for install."
          fi
